# 2つのEnvironmentの承認を1回の操作で行えるかの検証用。AWSは使わない
name: approval-poc

on:
  workflow_dispatch:
    inputs:
      fail_a:
        description: ジョブAの失敗を模擬する
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: echo "ゲートの検証の代わり"

  # ロール定義の適用に当たる
  a:
    needs: verify
    runs-on: ubuntu-latest
    environment: poc-a
    steps:
      - run: sleep 60
      - if: inputs.fail_a
        run: exit 1

  # 反映ジョブに当たる。A の完了を確かめてから進む
  b:
    needs: verify
    runs-on: ubuntu-latest
    environment: poc-b
    permissions:
      actions: read
    steps:
      - name: Wait for job a
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while :; do
            a=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "a")][0] | "\(.status) \(.conclusion)"')
            echo "job a: $a"
            case "$a" in
              "completed success") break ;;
              completed*) echo "job a did not succeed"; exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then echo "timed out waiting for job a"; exit 1; fi
            sleep 10
          done
      - run: echo "反映の代わり"
