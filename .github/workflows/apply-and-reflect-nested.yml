# 起動したブランチの定義で動く。aは main の再利用ワークフローを呼び、bは反映に当たる
name: apply-and-reflect-nested

on:
  workflow_call:

jobs:
  a:
    permissions:
      contents: read
      id-token: write
    uses: naru-rama/release-flow-poc/.github/workflows/roles-apply-poc.yml@main

  b:
    runs-on: ubuntu-latest
    environment: poc-b
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Show OIDC claims
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=poc" | jq -r .value)
          p=$(echo "$token" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#p} % 4 )) -ne 0 ]; do p="$p="; done
          echo "$p" | base64 -d | jq '{sub, ref, environment, job_workflow_ref, workflow_ref}'
      - name: Wait for job a
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 120))
          while :; do
            a=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name | test("/ apply$"))][0] | "\(.status) \(.conclusion)"')
            echo "job a: $a"
            case "$a" in
              "completed success") break ;;
              completed*) echo "job a did not succeed"; exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then echo "timed out waiting for job a"; exit 1; fi
            sleep 5
          done
